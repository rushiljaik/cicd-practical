name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          echo "Running tests..."
          python -c "import sys; assert sys.version_info >= (3, 12); print(sys.version)"
          echo "All tests passed!"
      - name: Build
        run: |
          echo "Building project..."
          python -m compileall .
          echo "Build successful!"
